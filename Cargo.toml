[workspace]
members = [
    "system",
    "kernel",
    "usrlib",
    "protocol/*",
    "fs/core",
    "fs/fat",
    "fs/partition",
    "fs/ramfs",
    "fs/rxfs",
    "arch/x86_64",
    "arch/x86_32",
    "arch/x86-generic",
    "arch/x86-runner",
    "apps/shell",
    "apps/init",
    "apps/dummy",
    "apps/pi",
    "apps/exiter",
    "apps/randomd",
    "apps/echo",
    "apps/bulk",
    "apps/pong",
    "apps/ping",
    "apps/mem",
    "apps/vfsd",
    "apps/vfs",
    "apps/snake",
    "apps/tetris",
    "apps/conway",
    "apps/stress",
    "apps/bench",
    "apps/threads",
    "apps/waitset",
    "apps/inputd",
    "apps/ps2d",
    "apps/atad",
    "apps/blockd",
    "apps/ata",
    "apps/format",
    "apps/mount",
    "apps/attach",
    "apps/rm",
    "apps/cp",
    "apps/mkdir",
    "apps/rmdir",
    "xtask",
    "tests-integration",
]
default-members = [
    "system",
    "kernel",
    "usrlib",
    "protocol/*",
    "fs/core",
    "fs/fat",
    "fs/partition",
    "fs/ramfs",
    "fs/rxfs",
    "apps/shell",
    "apps/dummy",
    "xtask",
]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.lints.rust]
unused = { level = "deny", priority = -1 }
unused_extern_crates = "allow"
unused_macro_rules = "allow"
unsafe_op_in_unsafe_fn = "deny"
private_interfaces = "deny"
irrefutable_let_patterns = "deny"
function_casts_as_integer = "deny"
deprecated = "deny"

[profile.dev]
panic = "abort"
opt-level = 0

[profile.release]
panic = "abort"
opt-level = 2
