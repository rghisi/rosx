[workspace]
members = [
    "system",
    "kernel",
    "usrlib",
    "vfs-protocol",
    "input-protocol",
    "arch/x86_64",
    "arch/x86_32",
    "apps/shell",
    "apps/dummy",
    "apps/pi",
    "apps/randomd",
    "apps/echo",
    "apps/bulk",
    "apps/pong",
    "apps/ping",
    "apps/mem",
    "apps/vfsd",
    "apps/vfs",
    "apps/snake",
    "apps/tetris",
    "apps/conway",
    "apps/stress",
    "apps/threads",
    "apps/inputd",
    "apps/ps2d",
    "xtask",
    "tests-integration",
]
default-members = [
    "system",
    "kernel",
    "usrlib",
    "vfs-protocol",
    "input-protocol",
    "apps/shell",
    "apps/dummy",
    "xtask",
]
resolver = "3"

[workspace.package]
edition = "2024"

[profile.dev]
panic = "abort"
opt-level = 0

[profile.release]
panic = "abort"
opt-level = 2
