[workspace]
members = [
    "system",
    "kernel",
    "usrlib",
    "protocol/*",
    "fs/rxfs",
    "arch/x86_64",
    "arch/x86_32",
    "arch/x86-generic",
    "arch/x86-runner",
    "apps/shell",
    "apps/dummy",
    "apps/pi",
    "apps/randomd",
    "apps/echo",
    "apps/bulk",
    "apps/pong",
    "apps/ping",
    "apps/mem",
    "apps/vfsd",
    "apps/vfs",
    "apps/snake",
    "apps/tetris",
    "apps/conway",
    "apps/stress",
    "apps/bench",
    "apps/threads",
    "apps/waitset",
    "apps/inputd",
    "apps/ps2d",
    "apps/atad",
    "apps/ata",
    "xtask",
    "tests-integration",
]
default-members = [
    "system",
    "kernel",
    "usrlib",
    "protocol/*",
    "fs/rxfs",
    "apps/shell",
    "apps/dummy",
    "xtask",
]
resolver = "3"

[workspace.package]
edition = "2024"

[profile.dev]
panic = "abort"
opt-level = 0

[profile.release]
panic = "abort"
opt-level = 2
