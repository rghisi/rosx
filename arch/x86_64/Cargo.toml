[package]
name = "rosx"
version = "0.1.0"
edition.workspace = true
build = "build.rs"

[dependencies]
system = { path = "../../system" }
kernel = { path = "../../kernel" }
x86-generic = { path = "../x86-generic" }
usrlib = { path = "../../usrlib" }
input-protocol = { path = "../../input-protocol" }
dummy = { path = "../../apps/dummy"}

bootloader_api = "0.11"
volatile = "0.2.6"
spin = "0.10.0"
x86_64 = "0.15"
pic8259 = "0.11"

[dependencies.lazy_static]
version = "1.0"
features = ["spin_no_std"]

[[bin]]
name = "rosx"
bench = false
test = false

