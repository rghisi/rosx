name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Test
        run: cargo xtask test --skip-integration

  build:
    name: Build Kernel (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Build
        run: cargo xtask build

      - name: Upload disk image
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: rosx-x86_64
          path: target/rosx/release/rosx-x86_64.img
          if-no-files-found: error

  integration:
    name: Integration Tests (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        profile: [dev, release]
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-int-${{ matrix.profile }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-int-${{ matrix.profile }}-

      - name: Test (${{ matrix.profile }} kernel)
        run: cargo test -p tests-integration -- --test-threads=1
        env:
          ROSX_QEMU_PROFILE: ${{ matrix.profile }}

  release:
    name: Create Release
    needs: [test, build, integration]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Get current date
        id: date
        run: |
          echo "date_name=$(date -u +'%Y-%m-%d %H%M%S')" >> $GITHUB_OUTPUT
          echo "date_tag=$(date -u +'%Y-%m-%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Download x86_64 disk image
        uses: actions/download-artifact@v4
        with:
          name: rosx-x86_64

      - name: Compress artifacts
        run: gzip -9 rosx-x86_64.img

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.date.outputs.date_tag }}
          name: ${{ steps.date.outputs.date_name }}
          files: rosx-x86_64.img.gz
