name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Test
        run: cargo xtask test

  build:
    name: Build Kernel (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Build
        run: cargo xtask build

      - name: Upload disk image
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: rosx-x86_64
          path: target/rosx/release/rosx-x86_64.img
          if-no-files-found: error

  build-x86_32:
    name: Build Kernel (x86_32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-build-x86_32-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-x86_32-

      - name: Build ELF apps
        run: cargo build --release -p hello_elf -p random_gen_server -p snake -p tetris -p conway --target arch/x86_32/rosx-i686-user.json -Zbuild-std=core,alloc,compiler_builtins -Zbuild-std-features=compiler-builtins-mem -Zjson-target-spec

      - name: Build kernel
        working-directory: arch/x86_32
        run: cargo build --release

      - name: Install image tools
        run: sudo apt-get install -y grub-pc-bin grub-common xorriso mtools

      - name: Build bootable image
        run: bash arch/x86_32/build-image.sh

      - name: Upload disk image
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: rosx-x86_32
          path: target/rosx-i686/release/rosx-x86_32.img
          if-no-files-found: error

  release:
    name: Create Release
    needs: [test, build, build-x86_32]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Get current date
        id: date
        run: |
          echo "date_name=$(date -u +'%Y-%m-%d %H%M%S')" >> $GITHUB_OUTPUT
          echo "date_tag=$(date -u +'%Y-%m-%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Download x86_64 disk image
        uses: actions/download-artifact@v4
        with:
          name: rosx-x86_64

      - name: Download x86_32 disk image
        uses: actions/download-artifact@v4
        with:
          name: rosx-x86_32

      - name: Compress artifacts
        run: |
          gzip -9 rosx-x86_64.img
          gzip -9 rosx-x86_32.img

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.date.outputs.date_tag }}
          name: ${{ steps.date.outputs.date_name }}
          files: |
            rosx-x86_64.img.gz
            rosx-x86_32.img.gz
