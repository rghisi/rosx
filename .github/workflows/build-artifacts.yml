name: Build Artifacts

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-x86_64:
    name: Build Kernel (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Build
        run: cargo xtask build

      - name: Upload disk image
        uses: actions/upload-artifact@v4
        with:
          name: rosx-x86_64
          path: target/rosx/release/rosx-x86_64.img
          if-no-files-found: error
          retention-days: 1

  build-x86_32:
    name: Build Kernel (x86_32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-build-x86_32-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-x86_32-

      - name: Build ELF apps
        run: cargo build --release -p hello_elf -p random_gen_server -p snake -p tetris -p conway --target arch/x86_32/rosx-i686-user.json -Zbuild-std=core,alloc,compiler_builtins -Zbuild-std-features=compiler-builtins-mem -Zjson-target-spec

      - name: Build kernel
        working-directory: arch/x86_32
        run: cargo build --release

      - name: Install image tools
        run: sudo apt-get install -y grub-pc-bin grub-common xorriso mtools

      - name: Build bootable image
        run: bash arch/x86_32/build-image.sh

      - name: Upload disk image
        uses: actions/upload-artifact@v4
        with:
          name: rosx-x86_32
          path: target/rosx-i686/release/rosx-x86_32.img
          if-no-files-found: error
          retention-days: 1
