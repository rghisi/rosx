[package]
authors = ["Ricardo Ghisi Tobaldini <rghisi@gmail.com>"]
name = "ps2d"
publish = false
version = "0.1.0"
edition.workspace = true

[lib]
name = "ps2d"
path = "src/lib.rs"

[[bin]]
name = "ps2d"
bench = false
test = false

[target.'cfg(target_os = "none")'.dependencies]
input-protocol = { path = "../../protocol/input" }
usrlib = { path = "../../usrlib", features = ["runtime"] }

[lints]
workspace = true
