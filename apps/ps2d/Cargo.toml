[package]
authors = ["Ricardo Ghisi Tobaldini <rghisi@gmail.com>"]
name = "ps2d"
publish = false
version = "0.1.0"
edition.workspace = true

[lib]
name = "ps2d"
path = "src/lib.rs"

[[bin]]
name = "ps2d"
bench = false
test = false

[dependencies]
system = { path = "../../system" }
usrlib = { path = "../../usrlib" }
input-protocol = { path = "../../input-protocol" }

[target.'cfg(target_os = "none")'.dependencies]
usrlib = { path = "../../usrlib", features = ["runtime"] }
