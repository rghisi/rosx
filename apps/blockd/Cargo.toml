[package]
authors = ["Ricardo Ghisi Tobaldini <rghisi@gmail.com>"]
name = "blockd"
publish = false
version = "0.1.0"
edition.workspace = true

[lib]
name = "blockd"
path = "src/lib.rs"

[[bin]]
name = "blockd"
bench = false
test = false

[dependencies]
block-protocol = { path = "../../protocol/block" }
usrlib = { path = "../../usrlib" }

[target.'cfg(target_os = "none")'.dependencies]
usrlib = { path = "../../usrlib", features = ["runtime"] }

[lints]
workspace = true
