[package]
authors = ["Ricardo Ghisi Tobaldini <rghisi@gmail.com>"]
name = "ipd"
publish = false
version = "0.1.0"
edition.workspace = true

[lib]
name = "ipd"
path = "src/lib.rs"

[[bin]]
name = "ipd"
bench = false
test = false

[dependencies]
net-protocol = { path = "../../protocol/net" }
ip-protocol = { path = "../../protocol/ip" }

[target.'cfg(target_os = "none")'.dependencies]
usrlib = { path = "../../usrlib", features = ["runtime"] }

[lints]
workspace = true
