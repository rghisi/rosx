[package]
authors = ["Ricardo Ghisi Tobaldini <rghisi@gmail.com>"]
name = "ata"
publish = false
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "ata"
bench = false
test = false

[dependencies]
system = { path = "../../system" }
usrlib = { path = "../../usrlib" }
ata-protocol = { path = "../../protocol/ata" }

[target.'cfg(target_os = "none")'.dependencies]
usrlib = { path = "../../usrlib", features = ["runtime"] }
