[package]
authors = ["Ricardo Ghisi Tobaldini <rghisi@gmail.com>"]
name = "ne2kd"
publish = false
version = "0.1.0"
edition.workspace = true

[lib]
name = "ne2kd"
path = "src/lib.rs"

[dependencies]
system = { path = "../../system" }
usrlib = { path = "../../usrlib" }

[target.'cfg(target_os = "none")'.dependencies]
usrlib = { path = "../../usrlib", features = ["runtime"] }
pci-protocol = { path = "../../protocol/pci" }

[lints]
workspace = true
